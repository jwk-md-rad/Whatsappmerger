[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-merger"
version = "0.1.0"
description = "Merge two large WhatsApp Android msgstore.db backups into one."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
crypto = ["wa-crypt-tools>=0.0.8"]
dev = ["pytest>=7"]

[project.scripts]
whatsapp-merger = "whatsapp_merger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
