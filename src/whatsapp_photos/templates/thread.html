<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ chat_name }} — WhatsApp Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="thread-page">
<header class="thread-header">
  <a href="/" class="back-link" aria-label="Back to archive">&#8249;</a>
  <div class="thread-title">
    <h1 id="chat-title">{{ chat_name }}</h1>
    <div class="thread-sub">
      {% if is_group %}group · {% endif %}{{ "{:,}".format(message_count) }} messages
    </div>
  </div>
  <div class="thread-actions">
    <label class="jump-field" title="Jump to a date in this conversation">
      <span>Jump to</span>
      <input type="date" id="jump-date">
    </label>
    <a href="/search?chat_id={{ chat_id }}&type=media" class="thread-search-link" title="Show all photos, videos and voice notes in this chat">Media</a>
    <button type="button" id="find-toggle" class="thread-search-link"
            aria-controls="find-bar" title="Find in this chat (⌘F)">Find</button>
    <a href="/search?chat_id={{ chat_id }}" class="thread-search-link" title="Full search (with filters and across chats)">Search</a>
  </div>
</header>
<div id="find-bar" hidden>
  <input type="search" id="find-input" placeholder="Find in this chat"
         autocomplete="off" autocorrect="off" spellcheck="false">
  <span id="find-status" aria-live="polite"></span>
  <button type="button" id="find-prev" aria-label="Previous match">&#8593;</button>
  <button type="button" id="find-next" aria-label="Next match">&#8595;</button>
  <button type="button" id="find-close" aria-label="Close find bar">&times;</button>
</div>
<div id="histogram-wrap" hidden>
  <div id="histogram"></div>
  <div id="histogram-axis"></div>
</div>
<main id="thread-stage">
  <div id="thread-top-loader" class="thread-loader" hidden>Loading older…</div>
  <div id="thread-messages"></div>
  <div id="thread-bottom-loader" class="thread-loader"></div>
</main>
<dialog id="lightbox">
  <div class="lb-stage">
    <button id="close-lb" aria-label="Close">&times;</button>
    <button class="lb-arrow prev" id="lb-prev" aria-label="Previous">&#8249;</button>
    <button class="lb-arrow next" id="lb-next" aria-label="Next">&#8250;</button>
    <img id="full">
    <div id="lb-text" hidden></div>
  </div>
  <div id="meta"></div>
</dialog>
<script>
  window.CHAT_ID = {{ chat_id }};
  window.CHAT_NAME = {{ chat_name|tojson }};
  window.IS_GROUP = {{ is_group|tojson }};
  window.MESSAGE_COUNT = {{ message_count }};
</script>
<script src="/static/thread.js" defer></script>
</body>
</html>
